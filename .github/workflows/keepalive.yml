name: Keep backend warm

# The API runs on Render's free plan, which spins the service down after ~15
# minutes with no traffic. The next visitor then pays a 30-50s cold start, which
# is what makes "the first launch of the day" feel slow while later launches are
# instant.
#
# This pings the DB-free /health endpoint often enough that the service never
# gets a chance to sleep. It costs nothing (public repo) and touches nothing but
# a static { "status": "ok" } response.

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler can lag under load, so each run also
    # pings again after a pause — see the step below — to widen the coverage.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_URL: https://eventreach-fisn.onrender.com/health
    steps:
      - name: First ping
        run: |
          curl --fail --silent --show-error --location \
               --max-time 90 --retry 4 --retry-delay 20 --retry-all-errors \
               -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
               "$HEALTH_URL"

      - name: Wait, then ping again (covers scheduler lag)
        run: |
          sleep 300
          curl --fail --silent --show-error --location \
               --max-time 90 --retry 4 --retry-delay 20 --retry-all-errors \
               -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
               "$HEALTH_URL"
