services:
  - type: web
    name: eventreach-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && cd shared && npm run build && cd ../backend && npm run build
    startCommand: cd backend && npm start
    # Lightweight, DB-free endpoint so Render detects readiness the moment the
    # server binds the port rather than inferring it.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_NAME
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      # Optional. Only used to read an approved template's body text for the
      # Composer preview; sending does not need it.
      - key: WHATSAPP_WABA_ID
        sync: false
      # Delivery-status webhook. VERIFY_TOKEN is a value you choose and paste
      # into the Meta dashboard; APP_SECRET comes from Meta (App settings >
      # Basic) and authenticates incoming callbacks.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
